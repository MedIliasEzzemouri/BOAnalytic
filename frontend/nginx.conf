# ====================================================================
#  Configuration nginx pour le frontend LegalEye
#  - Sert le SPA React
#  - Proxy /api vers le backend FastAPI
# ====================================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Taille max upload (bulletins PDF jusqu'a 50 Mo)
    client_max_body_size 100M;

    # SPA : toutes les routes non-API renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API : proxy vers le backend
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pour les uploads / pipelines longs
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cache aggressif sur les assets statiques avec hash
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Securite minimale
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff"    always;
    add_header Referrer-Policy          "no-referrer-when-downgrade" always;
}
